name: SuperKart MLOps Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "models/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Validate and register dataset
        run: python scripts/register_data.py

  data-prep:
    needs: register-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Clean data and create train/test split
        run: python scripts/data_prep.py
      - name: Upload train/test splits as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: train-test-data
          path: artifacts/

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Download train/test splits
        uses: actions/download-artifact@v4
        with:
          name: train-test-data
          path: artifacts/
      - name: Train, tune and track model with MLflow
        run: python scripts/train.py
      - name: Commit best model to main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/
          git diff --staged --quiet || git commit -m "chore: update trained model [skip ci]"
          git push origin HEAD:main
